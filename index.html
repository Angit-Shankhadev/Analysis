<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment Analysis Demo</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body { background-color: #f8f9fa; }
    .container { margin-top: 60px; max-width: 700px; }
    .card { padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    textarea { resize: none; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 class="card-title text-center mb-4">Customer Review Sentiment Analyzer</h2>
        <form action="/predict" method="post">
            <div class="form-group">
                <label for="review_text">Enter a customer review or social media post:</label>
                <textarea class="form-control" id="review_text" name="review_text" rows="6"
                    placeholder="e.g. This product exceeded my expectations, works perfectly!"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Analyse Sentiment</button>
        </form>
    </div>
</div>
</body>
</html>
